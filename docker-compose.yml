services:
  app:
    build: .
    # GitHub Actions bu imaji ghcr.io'a yayinlar; Pi uzerinde derleme
    # yapmak istemiyorsaniz CasaOS dosyasini kullanin (docker-compose.casaos.yml)
    image: ghcr.io/muratcihanyandi/wedding-memories:latest
    container_name: wedding-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Container ici sabit yollar; host tarafindan .env ile yapilandirilir
      APP_ENV: ${APP_ENV:-production}
      # SQLite varsayilan; PostgreSQL icin .env'de DATABASE_URL tanimlayin
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/db/wedding.sqlite3}
      UPLOAD_ROOT: /app/data/uploads
      FRONTEND_DIST: /app/static
      REQUIRE_STORAGE_MARKER: ${REQUIRE_STORAGE_MARKER:-true}
      PUBLIC_URL: ${PUBLIC_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${APP_PORT:-33464}:33464"
    volumes:
      # Upload'lar USB diskte tutulur - container silinse de kaybolmaz
      - ${UPLOAD_ROOT_HOST:-/mnt/usb/wedding-uploads}:/app/data/uploads
      # SQLite veritabani named volume'da (USB diski yavaysa DB ayri tutulur)
      - db-data:/app/data/db

  # Opsiyonel TLS reverse proxy - "docker compose --profile proxy up -d"
  # ile calistirilir. Default kurulumda gerekmez (app dogrudan yayinlanir).
  proxy:
    image: nginx:alpine
    profiles: ["proxy"]
    container_name: wedding-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  db-data:
