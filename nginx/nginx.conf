# Opsiyonel TLS reverse proxy (docker compose --profile proxy up -d).
# Buyuk dosya yuklemeleri icin kritik ayarlar:
#   client_max_body_size 0        -> boyut limiti yok (limiti backend belirler)
#   proxy_request_buffering off  -> 1GB+ yukleme nginx diskinde buffere edilmez

server {
    listen 80;
    server_name _;

    # HTTP -> HTTPS yonlendirmesi HTTPS aktif edildiginde acilir:
    # return 301 https://$host$request_uri;

    client_max_body_size 0;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

