# ============================================================
# CasaOS icin Wedding Memories kurulum dosyasi
#
# Kullanim:
#   1) Asagidaki DEGISTIR etiketli degerleri kendinize gore duzenleyin
#   2) CasaOS -> App Store -> sag ust "+" -> "DockerCompose / Command"
#      (veya "Install from Docker-compose") secenegine bu icerigi yapistirin
#   3) ADMIN_PASSWORD_HASH icin once
#      https://github.com/muratcihanyandi/wedding-memories repo'sundan
#      scripts/generate_admin_hash.py calistirip cikan hash'i koyun
#
# ONEMLI (CasaOS uyumlulugu):
#   - Named volume KULLANMAZ (CasaOS compose ithalati named volume'lari
#     bozar -> "field Source must not be empty" hatasi). DB icin acik
#     host yolu verilir: /DATA/AppData/... (CasaOS veri dizini).
#   - ${DEGISKEN} sozdizimi KULLANMAZ - CasaOS'un ayristiricisi
#     hepsini bos birakabilir. Degerler dogrudan yazilir.
#   - Kurulumdan once Pi'de SSH ile klasiculeri hazirlayin:
#       sudo mkdir -p /mnt/usb/wedding-uploads
#       sudo touch /mnt/usb/wedding-uploads/.wedding-storage
#       sudo mkdir -p /DATA/AppData/wedding-memories/db
#       sudo chown -R 1000:1000 /mnt/usb/wedding-uploads /DATA/AppData/wedding-memories
#
# Port: 33464 = telefon tuslarinda WEDDING (933464).
# ============================================================

services:
  wedding-memories:
    image: ghcr.io/muratcihanyandi/wedding-memories:latest
    container_name: wedding-app
    restart: unless-stopped
    ports:
      - "33464:33464"
    environment:
      - APP_ENV=production
      # PostgreSQL varsayilan (hazir sunucu: 192.168.2.170).
      # DEGISTIR: KULLANICI ve SIFRE'yi kendi sunucunuzun bilgileriyle
      # degistirin. Tablolar ilk acilista otomatik olusur.
      - DATABASE_URL=postgresql://KULLANICI:SIFRE@192.168.2.170:5432/wedding_memories
      # PostgreSQL yerine SQLite isterseniz ustteki satiri silip bunu acin:
      # - DATABASE_URL=sqlite:////app/data/db/wedding.sqlite3
      - UPLOAD_ROOT=/app/data/uploads
      - FRONTEND_DIST=/app/static
      - REQUIRE_STORAGE_MARKER=true
      - ADMIN_USERNAME=admin
      # DEGISTIR: giris sifresi - buraya ne yazdiysaniz o gecerli.
      - ADMIN_PASSWORD=DEGISTIR-SIFRE
      # Isterseniz hash de kullanabilirsiniz (ADMIN_PASSWORD silinir):
      # docker-compose YAML icinde $ isaretleri $$ olarak kacinmali,
      # yoksa compose degisken sanip siler:
      # - ADMIN_PASSWORD_HASH=pbkdf2_sha256$$600000$$abc$$def
      # DEGISTIR: rastgele uzun metin, or: python -c "import secrets;print(secrets.token_hex(32))"
      - SESSION_SECRET=DEGISTIR-RASTGELE-METIN
      # DEGISTIR: Pi'nin IP'si + port (dugun WiFi'indaki adresi)
      - PUBLIC_URL=http://RASPBERRY-PI-IP:33464
    volumes:
      # DEGISTIR: USB diskizin CasaOS'taki yolu (mount edildikten sonra).
      # Kaynak taraf ASLA bos birakilmamali - hata bunu boyle verir.
      - /mnt/usb/wedding-uploads:/app/data/uploads
      # CasaOS veri dizini - named volume degil, acik yol:
      - /DATA/AppData/wedding-memories/db:/app/data/db
